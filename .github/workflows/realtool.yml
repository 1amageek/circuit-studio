name: real-tool signoff tests

# Runs the gated real-tool tests (LiveSignoff / MagicDRC / NetgenLVS /
# PDKBlock / MultiCellBlock / SignoffCLI / PDKSchematic) against a real
# Magic + Netgen + Sky130 toolchain, so the real DRC/LVS/PEX flow is exercised
# on every push. Without the toolchain those tests skip; here they run for real.
#
# circuit-studio depends on sibling packages via local paths, so they are checked
# out alongside it (../CoreSpice, ../semiconductor-layout, ../swift-mask-data,
# ../PEXEngine).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  realtool:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: circuit-studio }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/CoreSpice, path: CoreSpice }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/semiconductor-layout, path: semiconductor-layout }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/swift-mask-data, path: swift-mask-data }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/PEXEngine, path: PEXEngine }

      - name: Select Xcode (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Cache toolchain (Magic + Netgen + Sky130 PDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/magic
            ~/.local/netgen
            ~/.volare
          key: signoff-toolchain-${{ runner.os }}-${{ hashFiles('circuit-studio/scripts/install-toolchain.sh') }}

      - name: Install / detect toolchain
        working-directory: circuit-studio
        run: bash scripts/install-toolchain.sh   # appends MAGIC_BIN/NETGEN_BIN/PDK_ROOT to $GITHUB_ENV

      - name: Run tests (gated real-tool tests now execute)
        working-directory: circuit-studio
        run: swift test
