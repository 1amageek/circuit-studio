name: real-tool signoff tests

# Runs the gated real-tool tests (LiveSignoff / MagicDRC / NetgenLVS /
# PDKBlock / MultiCellBlock / SignoffCLI / PDKSchematic) against a real
# Magic + Netgen + Sky130 toolchain, so the real DRC/LVS/PEX flow is exercised
# on every push. Without the toolchain those tests skip; here they run for real.
#
# Selected dependencies are checked out alongside circuit-studio so the same
# revisions can be exercised with the real toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  realtool:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with: { path: circuit-studio }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/CoreSpice, path: CoreSpice }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/semiconductor-layout, path: semiconductor-layout }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/swift-mask-data, path: swift-mask-data }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/PEXEngine, path: PEXEngine }

      - name: Select signed OSS Swift 6.4.0
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -eq 27
          test "$(uname -m)" = arm64
          xcodebuild -version
          pkg="$RUNNER_TEMP/swift-6.4.0-RELEASE-osx.pkg"
          curl --fail --location --max-time 600 \
            https://download.swift.org/swift-6.4.0-release/xcode/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-osx.pkg \
            --output "$pkg"
          pkgutil --check-signature "$pkg" > "$RUNNER_TEMP/swift-signature.txt"
          cat "$RUNNER_TEMP/swift-signature.txt"
          grep -Fq 'Developer ID Installer: Swift Open Source (V9AUD2URP3)' \
            "$RUNNER_TEMP/swift-signature.txt"
          installer -target CurrentUserHomeDirectory -pkg "$pkg"
          toolchain="$HOME/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain"
          toolchain_id="$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")"
          test "$toolchain_id" = org.swift.640202609131a
          test "$(plutil -extract Version raw "$toolchain/Info.plist")" = 6.4.20260913101
          export TOOLCHAINS="$toolchain_id"
          export PATH="$toolchain/usr/bin:$PATH"
          echo "TOOLCHAINS=$TOOLCHAINS" >> "$GITHUB_ENV"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
          test "$(command -v swift)" = "$toolchain/usr/bin/swift"
          test "$(xcrun --find swift)" = "$toolchain/usr/bin/swift"
          swift --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -Fxq 'Apple Swift version 6.4 (swift-6.4-RELEASE)' "$RUNNER_TEMP/swift-version.txt"
          xcrun swift --version | tee "$RUNNER_TEMP/xcrun-swift-version.txt"
          grep -Fxq 'Apple Swift version 6.4 (swift-6.4-RELEASE)' "$RUNNER_TEMP/xcrun-swift-version.txt"

      - name: Cache toolchain (Magic + Netgen + Sky130 PDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/magic
            ~/.local/netgen
            ~/.volare
          key: signoff-toolchain-${{ runner.os }}-${{ hashFiles('circuit-studio/scripts/install-toolchain.sh') }}

      - name: Install / detect toolchain
        working-directory: circuit-studio
        env:
          CIRCUIT_STUDIO_TOOL_ENV_FILE: .build/real-tool-environment
        run: bash scripts/install-toolchain.sh

      - name: Run tests (gated real-tool tests now execute)
        working-directory: circuit-studio
        env:
          CIRCUIT_STUDIO_REQUIRE_REAL_TOOLS: "1"
        run: |
          mkdir -p .build
          touch .build/require-real-tools
          ./scripts/swift-test-timeout.sh 5400 \
            xcodebuild test \
              -workspace .swiftpm/xcode/package.xcworkspace \
              -scheme CircuitStudio-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 30 \
              -resultBundlePath realtool-tests.xcresult \
              CODE_SIGNING_ALLOWED=NO

      - name: Retain test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtool-tests
          path: circuit-studio/realtool-tests.xcresult
          if-no-files-found: error
