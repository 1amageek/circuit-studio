name: real-tool signoff tests

# Runs the gated real-tool tests (LiveSignoff / MagicDRC / NetgenLVS /
# PDKBlock / MultiCellBlock / SignoffCLI / PDKSchematic) against a real
# Magic + Netgen + Sky130 toolchain, so the real DRC/LVS/PEX flow is exercised
# on every push. Without the toolchain those tests skip; here they run for real.
#
# Selected dependencies are checked out alongside circuit-studio so the same
# revisions can be exercised with the real toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  realtool:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: circuit-studio }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/CoreSpice, path: CoreSpice }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/semiconductor-layout, path: semiconductor-layout }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/swift-mask-data, path: swift-mask-data }
      - uses: actions/checkout@v4
        with: { repository: 1amageek/PEXEngine, path: PEXEngine }

      - name: Verify Swift 6.3 toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache toolchain (Magic + Netgen + Sky130 PDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/magic
            ~/.local/netgen
            ~/.volare
          key: signoff-toolchain-${{ runner.os }}-${{ hashFiles('circuit-studio/scripts/install-toolchain.sh') }}

      - name: Install / detect toolchain
        working-directory: circuit-studio
        env:
          CIRCUIT_STUDIO_TOOL_ENV_FILE: .build/real-tool-environment
        run: bash scripts/install-toolchain.sh

      - name: Run tests (gated real-tool tests now execute)
        working-directory: circuit-studio
        env:
          CIRCUIT_STUDIO_REQUIRE_REAL_TOOLS: "1"
        run: |
          mkdir -p .build
          touch .build/require-real-tools
          ./scripts/swift-test-timeout.sh 5400 \
            xcodebuild test \
              -workspace .swiftpm/xcode/package.xcworkspace \
              -scheme CircuitStudio-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 30 \
              -resultBundlePath realtool-tests.xcresult \
              CODE_SIGNING_ALLOWED=NO

      - name: Retain test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtool-tests
          path: circuit-studio/realtool-tests.xcresult
          if-no-files-found: error
